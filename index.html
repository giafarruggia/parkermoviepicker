<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="Ghostface.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>what should i watch tonight?</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<div class="container">
    <h1>what should i watch tonight?</h1>

    <label for="medium">i want to watch a...</label>
    <select id="medium">
        <option value="">any medium</option>
    </select>

<div class="runtime-wrapper">
    <label for="length">with a runtime less than <span id="runtimeDisplay">120</span> minutes</label>

    <input
        type="range"
        id="length"
        min="60"
        max="240"
        step="10"
        value="120"
    />


</div>

    <label>from the...</label>
    <div id="decadesContainer"></div>

    <label>and the vibes are...</label>
    <div id="vibesContainer"></div>

<div class="button-row">
    <button id="pickMovie">tonight i should watch...</button>
    <button id="randomMovie">i'm feelin' lucky!</button>
</div>

    <div id="result"></div>

    <a href="#" id="refreshData" class="refresh-link">waiter waiter! fresh data please!</a>
</div>

<script src="script.js"></script>
</body>
</html>
